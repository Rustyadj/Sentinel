name: Production readiness

on:
  pull_request:
  push:
    branches: [main, production/sentinel-operational-hardening]
  # A deliberate, human-started deploy of the head of main. It runs every check below first, and the
  # `production` environment's protection rules (required reviewers) still apply.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://sentinel:sentinel@127.0.0.1:5432/sentinel_test
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
      AUTH_URL: http://127.0.0.1:3000
      # vitest.config.ts deliberately ignores DATABASE_URL and REDIS_URL: on a
      # developer machine those point at the running application, and the suite
      # must never be able to reach it. It resolves its own targets instead,
      # defaulting to local throwaway instances that do not exist on a runner.
      # These two variables are how a caller says "this environment is already
      # disposable" — without them the job connects to nothing and every
      # database-backed test fails.
      SENTINEL_TEST_DATABASE_URL: postgresql://sentinel:sentinel@127.0.0.1:5432/sentinel_test
      SENTINEL_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma migrate status
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    env:
      SENTINEL_RELEASE_SHA: ${{ github.sha }}
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The deployed unit is the app, the migration job and BOTH workers, all from one revision.
      - name: Compose file resolves (output suppressed because it would print the environment)
        run: docker compose config --quiet
      - name: Build every image the release deploys
        run: docker compose build app migrate learning-worker orchestration-worker
      - name: Every image carries the release revision
        shell: bash
        run: |
          set -euo pipefail
          for image in sentinel-os-app sentinel-os-migrate sentinel-os-worker; do
            label="$(docker image inspect "$image:$GITHUB_SHA" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            commit="$(docker image inspect "$image:$GITHUB_SHA" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^SENTINEL_COMMIT=//p')"
            echo "$image label=$label commit=$commit"
            test "$commit" = "$GITHUB_SHA"
            # the migrate image is the builder stage, which carries no label of its own
            if [ "$image" != sentinel-os-migrate ]; then test "$label" = "$GITHUB_SHA"; fi
          done
      - name: No host credentials or runtime state inside any image
        shell: bash
        run: |
          set -euo pipefail
          for image in sentinel-os-app sentinel-os-migrate sentinel-os-worker; do
            docker run --rm --entrypoint sh "$image:$GITHUB_SHA" -c '
              ! find / -xdev \( -name .credentials.json -o -name .claude.json -o -path "*/runtime-agents" -o -path "*/runtime-projects" \) -not -path "/proc/*" 2>/dev/null | grep -q .
            ' || { echo "::error::$image contains host runtime credentials or state"; exit 1; }
          done
      - name: Worker image can run the bind-mounted CLIs (glibc) and starts as non-root
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id "sentinel-os-worker:$GITHUB_SHA" -u)" = 1001
          docker run --rm --entrypoint sh "sentinel-os-worker:$GITHUB_SHA" -c 'ldd --version >/dev/null && test -x /app/node_modules/.bin/tsx && test -L /usr/local/bin/claude && test -x /usr/local/bin/codex'

  smoke:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sentinel:sentinel@127.0.0.1:5432/sentinel_test
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
      AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate && npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy-gate:
    if: always()
    needs: [verify, docker, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Block deployment unless every required check passed
        run: |
          test "${{ needs.verify.result }}" = success
          test "${{ needs.docker.result }}" = success
          test "${{ needs.smoke.result }}" = success

  # Production deploys only when it is asked for, and only from main:
  #   * workflow_dispatch — someone started it on purpose; or
  #   * a push to main, and only while the repository variable SENTINEL_AUTODEPLOY is "true".
  # Without that opt-in a merge to main runs every check and deploys nothing. Neither path replaces the
  # `production` environment's required-reviewer rule; that is the approval, and this is the second lock.
  deploy-production:
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && vars.SENTINEL_AUTODEPLOY == 'true'))
    needs: deploy-gate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: sentinel-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_APP_DIR"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/sentinel_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      # The deploy logic lives in scripts/deploy/release.sh and is streamed from the release commit itself, so
      # the script that deploys a revision is that revision's own. It backs up and verifies the backup, builds
      # the app, migration job and both workers at this sha, migrates, starts them, waits for readiness, proves
      # every running container is this sha, and rolls every service back to the previously running revision
      # if any of that fails.
      - name: Back up and deploy the exact green commit
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_SSH_PORT:-22}"
          APP_DIR_B64="$(printf '%s' "$VPS_APP_DIR" | base64 -w0)"
          ssh -i "$HOME/.ssh/sentinel_deploy" -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<REMOTE
          set -Eeuo pipefail
          APP_DIR="\$(printf '%s' '$APP_DIR_B64' | base64 -d)"
          case "\$APP_DIR" in
            ""|"/"|"\$HOME") echo "Refusing unsafe VPS_APP_DIR" >&2; exit 1 ;;
          esac
          cd "\$APP_DIR"
          git fetch --quiet --prune origin main
          git cat-file -e '$RELEASE_SHA^{commit}'
          git show '$RELEASE_SHA:scripts/deploy/release.sh' | APP_DIR="\$APP_DIR" bash -s -- deploy '$RELEASE_SHA'
          REMOTE
