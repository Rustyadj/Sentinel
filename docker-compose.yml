# Every image is built from one release revision and tagged with it
# (sentinel-os-<service>:<SENTINEL_RELEASE_SHA>), so "which code is running" is
# a property of the tag, a label and an env var, and a rollback is the same
# compose file with the previous revision. scripts/deploy/release.sh sets the
# variable and verifies the running containers against it.
x-release-build-args: &release-build-args
  SENTINEL_COMMIT: ${SENTINEL_RELEASE_SHA:-unknown}
  SENTINEL_BUILT_AT: ${SENTINEL_BUILT_AT:-unknown}

# What a worker needs to reach its runtimes. The orchestration worker is the
# process that actually executes a claude-code/codex run, so it needs exactly what
# the app has: the CLI binaries and their credentials (bind-mounted, never baked
# into an image), a resolvable host.docker.internal for the Hermes dashboards, and
# the same project root.
x-runtime-mounts: &runtime-mounts
  - agent_configs:/opt/sentinel-os/agents
  - agent_logs:/opt/sentinel-os/logs
  - ${AGENT_PROJECT_ROOT_HOST:-./runtime-projects}:/opt/sentinel-os/projects
  - ./runtime-agents/bin:/opt/runtime-bin:ro
  - ./runtime-agents/home:/opt/runtime-home:rw

x-worker-healthcheck: &worker-healthcheck
  # Fresh only while the worker can round-trip to Postgres and Redis (src/workers/heartbeat.ts).
  test: ["CMD-SHELL", "test -f /tmp/worker-heartbeat && test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker-heartbeat) )) -lt 60"]
  interval: 15s
  timeout: 5s
  retries: 4
  start_period: 60s

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermesos
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermesos"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: sentinel-os-migrate:${SENTINEL_RELEASE_SHA:-local}
    build:
      context: .
      target: builder
      args: *release-build-args
    command: npx prisma@6 migrate deploy
    environment:
      DATABASE_URL: postgresql://hermes:hermes@postgres:5432/hermesos
    networks:
      - sentinel_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction, not allkeys-lru: this Redis now backs the Learning Core
    # BullMQ queue (src/lib/learning/queue.ts), and LRU eviction can
    # silently drop queued/delayed job data under memory pressure — BullMQ
    # itself warns about this at connection time. Confirmed by actually
    # connecting a real Queue/Worker against this policy in this session
    # (see the PR — this isn't a guess). Nothing else using this instance
    # (src/lib/redis.ts's health-check client) depends on eviction behavior.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    image: sentinel-os-app:${SENTINEL_RELEASE_SHA:-local}
    build:
      context: .
      target: runner
      args: *release-build-args
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hermes:hermes@postgres:5432/hermesos
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-https://sentinel.srv1427612.hstgr.cloud}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SENTINEL_DEFAULT_UI: ${SENTINEL_DEFAULT_UI:-true}
      SENTINEL_RELEASE_SHA: ${SENTINEL_RELEASE_SHA:-unknown}
      SENTINEL_COMMIT: ${SENTINEL_RELEASE_SHA:-unknown}
      SENTINEL_BUILT_AT: ${SENTINEL_BUILT_AT:-unknown}
      SENTINEL_TELEMETRY_URL: ${SENTINEL_TELEMETRY_URL:-}
      SENTINEL_TELEMETRY_TOKEN: ${SENTINEL_TELEMETRY_TOKEN:-}
      HERMES_ENDPOINT: ${HERMES_ENDPOINT:-http://host.docker.internal:4860}
      HERMES_NATHAN2_ENDPOINT: ${HERMES_NATHAN2_ENDPOINT:-http://host.docker.internal:4864}
      HERMES_LISA_USERNAME: ${HERMES_LISA_USERNAME:-}
      HERMES_LISA_PASSWORD: ${HERMES_LISA_PASSWORD:-}
      HERMES_NATHAN2_USERNAME: ${HERMES_NATHAN2_USERNAME:-}
      HERMES_NATHAN2_PASSWORD: ${HERMES_NATHAN2_PASSWORD:-}
      HERMES_NATHAN2_SESSION_TOKEN: ${HERMES_NATHAN2_SESSION_TOKEN:-}
      HERMES_SESSION_TOKEN: ${HERMES_SESSION_TOKEN:-}
      HERMES_LISA_CONTAINER: ${HERMES_LISA_CONTAINER:-hermes-lisa}
      HOST_CONTROL_URL: ${HOST_CONTROL_URL:-http://host.docker.internal:8977}
      HOST_CONTROL_TOKEN: ${HOST_CONTROL_TOKEN:-}
      HERMES_LISA_NATIVE_URL: ${HERMES_LISA_NATIVE_URL:-/legacy/hermes}
      HERMES_LISA_MODEL: ${HERMES_LISA_MODEL:-gpt-5.6-luna}
      HERMES_NATHAN2_MODEL: ${HERMES_NATHAN2_MODEL:-gpt-5.6-luna}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ALLOW_BROWSER_PROVIDER_KEYS: "false"
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      VOICE_WORKER_SECRET: ${VOICE_WORKER_SECRET:-}
      # System 1 (docs/SYSTEM_ONE.md). Defaults keep it off; the key falls back to OPENROUTER_API_KEY.
      SYSTEM_ONE_ENABLED: ${SYSTEM_ONE_ENABLED:-true}
      SYSTEM_ONE_MODE: ${SYSTEM_ONE_MODE:-off}
      SYSTEM_ONE_MODE_HERMES_LISA: ${SYSTEM_ONE_MODE_HERMES_LISA:-}
      SYSTEM_ONE_MODE_HERMES_NATHAN2: ${SYSTEM_ONE_MODE_HERMES_NATHAN2:-}
      SYSTEM_ONE_API_KEY: ${SYSTEM_ONE_API_KEY:-}
      SYSTEM_ONE_BASE_URL: ${SYSTEM_ONE_BASE_URL:-}
      SYSTEM_ONE_MODEL: ${SYSTEM_ONE_MODEL:-}
      SYSTEM_ONE_TIMEOUT_MS: ${SYSTEM_ONE_TIMEOUT_MS:-}
      SYSTEM_ONE_VOICE_TIMEOUT_MS: ${SYSTEM_ONE_VOICE_TIMEOUT_MS:-}
      SYSTEM_ONE_HIGH_CONFIDENCE: ${SYSTEM_ONE_HIGH_CONFIDENCE:-}
      SYSTEM_ONE_LOW_CONFIDENCE: ${SYSTEM_ONE_LOW_CONFIDENCE:-}
      SYSTEM_ONE_ROUTE_HIGH_CONFIDENCE: ${SYSTEM_ONE_ROUTE_HIGH_CONFIDENCE:-}
      SYSTEM_ONE_ROUTE_LOW_CONFIDENCE: ${SYSTEM_ONE_ROUTE_LOW_CONFIDENCE:-}
      SYSTEM_ONE_TOOL_HIGH_CONFIDENCE: ${SYSTEM_ONE_TOOL_HIGH_CONFIDENCE:-}
      SYSTEM_ONE_TOOL_LOW_CONFIDENCE: ${SYSTEM_ONE_TOOL_LOW_CONFIDENCE:-}
      SYSTEM_ONE_NOUL_THRESHOLD: ${SYSTEM_ONE_NOUL_THRESHOLD:-}
      SYSTEM_ONE_FAST_PATH_SURFACES: ${SYSTEM_ONE_FAST_PATH_SURFACES:-voice}
      SYSTEM_ONE_BREAKER_FAILURES: ${SYSTEM_ONE_BREAKER_FAILURES:-}
      SYSTEM_ONE_BREAKER_OPEN_MS: ${SYSTEM_ONE_BREAKER_OPEN_MS:-}
      SYSTEM_ONE_WARMUP: ${SYSTEM_ONE_WARMUP:-true}
      SYSTEM_ONE_BASELINE_TELEMETRY: ${SYSTEM_ONE_BASELINE_TELEMETRY:-true}
      SENTINEL_AGENT_MCP_HERMES_NATHAN2_URL: ${SENTINEL_AGENT_MCP_HERMES_NATHAN2_URL:-}
      SENTINEL_AGENT_MCP_HERMES_NATHAN2_TOKEN: ${SENTINEL_AGENT_MCP_HERMES_NATHAN2_TOKEN:-}
      SENTINEL_AGENT_MCP_HERMES_NATHAN2_NAME: ${SENTINEL_AGENT_MCP_HERMES_NATHAN2_NAME:-mobileops}
      MOBILEOPS_MCP_URL: ${MOBILEOPS_MCP_URL:-}
      MOBILEOPS_MCP_TOKEN: ${MOBILEOPS_MCP_TOKEN:-}
      AGENT_CONFIG_DIR: /opt/sentinel-os/agents
      AGENT_LOG_DIR: /opt/sentinel-os/logs
      AGENT_PROJECT_ROOT: /opt/sentinel-os/projects
      # claude/codex binaries + auth are copied from the host (see
      # /opt/sentinel-os/runtime-agents/) and mounted below — this VPS
      # already has both installed and authenticated interactively; the
      # container reuses those same credentials rather than a fresh login.
      CLAUDE_CODE_EXECUTABLE: ${CLAUDE_CODE_EXECUTABLE:-/opt/runtime-bin/claude}
      CLAUDE_CODE_PROJECT_ROOT: /opt/sentinel-os/projects
      CLAUDE_CODE_WORKSPACE_ID: ${CLAUDE_CODE_WORKSPACE_ID:-}
      CODEX_EXECUTABLE: ${CODEX_EXECUTABLE:-/opt/runtime-bin/codex}
      CODEX_PROJECT_ROOT: /opt/sentinel-os/projects
      CODEX_WORKSPACE_ID: ${CODEX_WORKSPACE_ID:-}
      HOME: /opt/runtime-home
      CLAUDE_CONFIG_DIR: /opt/runtime-home/.claude
      CODEX_HOME: /opt/runtime-home/.codex
      # The provider passes this host-visible path to short-lived snapshot
      # helpers through the Docker daemon. It is intentionally never mounted
      # into an agent workspace.
      AGENT_WORKSPACE_SNAPSHOT_DIR: /var/lib/sentinel/workspace-snapshots
    volumes:
      - agent_configs:/opt/sentinel-os/agents
      - agent_logs:/opt/sentinel-os/logs
      - ${AGENT_PROJECT_ROOT_HOST:-./runtime-projects}:/opt/sentinel-os/projects
      - ./runtime-agents/bin:/opt/runtime-bin:ro
      - ./runtime-agents/home:/opt/runtime-home:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/sentinel/workspace-snapshots:/var/lib/sentinel/workspace-snapshots:rw
    # The non-root app user needs the Docker socket's host group. Set
    # DOCKER_GID explicitly on hosts where the socket group differs.
    group_add:
      - "${DOCKER_GID:-988}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Traefik routing is managed via /etc/traefik/dynamic/sentinel.yml on the host

  # Learning Core worker — BullMQ consumer for the recurring jobs registered
  # in src/lib/learning/queue.ts (degradation sweep, knowledge-gap analysis,
  # experience replay, memory consolidation). Built from the `worker` stage,
  # the same image as the orchestration worker, so both workers always run the
  # same revision as the app. `command` invokes the tsx binary directly rather
  # than `npm run worker:learning` — `npm run` does not forward SIGTERM, which
  # would hard-kill in-flight jobs instead of shutting the worker down gracefully.
  learning-worker:
    image: sentinel-os-worker:${SENTINEL_RELEASE_SHA:-local}
    build: &worker-build
      context: .
      target: worker
      args: *release-build-args
    command: node_modules/.bin/tsx src/workers/learning-worker.ts
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hermes:hermes@postgres:5432/hermesos
      MOBILEOPS_MCP_URL: ${MOBILEOPS_MCP_URL:-}
      MOBILEOPS_MCP_TOKEN: ${MOBILEOPS_MCP_TOKEN:-}
      REDIS_URL: redis://redis:6379
      LEARNING_WORKER_CONCURRENCY: ${LEARNING_WORKER_CONCURRENCY:-2}
      NEURAL_SWEEP_SECRET: ${NEURAL_SWEEP_SECRET:-}
      SENTINEL_RELEASE_SHA: ${SENTINEL_RELEASE_SHA:-unknown}
    healthcheck: *worker-healthcheck
    networks:
      - sentinel_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Durable external orchestration worker — consumes the BullMQ "orchestration"
  # queue that /api/mcp's route_task and the bot task API enqueue. Without this
  # service a run is queued and never executed.
  #
  # It executes the runtimes, so it is configured like the app for them: the CLI
  # binaries and credentials mounted from the host, HOME/CLAUDE_CONFIG_DIR/CODEX_HOME
  # pointing at the mounted home, and host.docker.internal resolvable (the Nathan2
  # dashboard is only reachable through it). Before this, claude-code runs failed with
  # `binary_missing` and Nathan2 was unreachable from the worker.
  #
  # It waits on the same `migrate` completion gate as app: dispatch filters
  # candidates on agent_runtimes.executionVerified, which defaults to false, so
  # starting ahead of the seed migration would reject every run.
  orchestration-worker:
    image: sentinel-os-worker:${SENTINEL_RELEASE_SHA:-local}
    build: *worker-build
    command: node_modules/.bin/tsx src/workers/orchestration-worker.ts
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hermes:hermes@postgres:5432/hermesos
      MOBILEOPS_MCP_URL: ${MOBILEOPS_MCP_URL:-}
      MOBILEOPS_MCP_TOKEN: ${MOBILEOPS_MCP_TOKEN:-}
      REDIS_URL: redis://redis:6379
      ORCHESTRATION_WORKER_CONCURRENCY: ${ORCHESTRATION_WORKER_CONCURRENCY:-1}
      SENTINEL_RELEASE_SHA: ${SENTINEL_RELEASE_SHA:-unknown}
      AGENT_CONFIG_DIR: /opt/sentinel-os/agents
      AGENT_LOG_DIR: /opt/sentinel-os/logs
      AGENT_PROJECT_ROOT: /opt/sentinel-os/projects
      CLAUDE_CODE_EXECUTABLE: ${CLAUDE_CODE_EXECUTABLE:-/opt/runtime-bin/claude}
      CLAUDE_CODE_PROJECT_ROOT: /opt/sentinel-os/projects
      CLAUDE_CODE_WORKSPACE_ID: ${CLAUDE_CODE_WORKSPACE_ID:-}
      CODEX_EXECUTABLE: ${CODEX_EXECUTABLE:-/opt/runtime-bin/codex}
      CODEX_PROJECT_ROOT: /opt/sentinel-os/projects
      CODEX_WORKSPACE_ID: ${CODEX_WORKSPACE_ID:-}
      HOME: /opt/runtime-home
      CLAUDE_CONFIG_DIR: /opt/runtime-home/.claude
      CODEX_HOME: /opt/runtime-home/.codex
      HERMES_ENDPOINT: ${HERMES_ENDPOINT:-http://host.docker.internal:4860}
      HERMES_SESSION_TOKEN: ${HERMES_SESSION_TOKEN:-}
      HERMES_LISA_USERNAME: ${HERMES_LISA_USERNAME:-}
      HERMES_LISA_PASSWORD: ${HERMES_LISA_PASSWORD:-}
      HERMES_LISA_CONTAINER: ${HERMES_LISA_CONTAINER:-hermes-lisa}
      HERMES_LISA_MODEL: ${HERMES_LISA_MODEL:-gpt-5.6-luna}
      HERMES_NATHAN2_ENDPOINT: ${HERMES_NATHAN2_ENDPOINT:-http://host.docker.internal:4864}
      HERMES_NATHAN2_USERNAME: ${HERMES_NATHAN2_USERNAME:-}
      HERMES_NATHAN2_PASSWORD: ${HERMES_NATHAN2_PASSWORD:-}
      HERMES_NATHAN2_SESSION_TOKEN: ${HERMES_NATHAN2_SESSION_TOKEN:-}
      HERMES_NATHAN2_MODEL: ${HERMES_NATHAN2_MODEL:-gpt-5.6-luna}
    volumes: *runtime-mounts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck: *worker-healthcheck
    networks:
      - sentinel_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # SentinelVoiceGateway worker — LiveKit Agents (Silero VAD + turn detector +
  # Deepgram Flux STT + Cartesia Sonic 3.5 TTS), routed through this app's own
  # /api/chat. Behind a profile since it needs LiveKit/Deepgram/Cartesia
  # credentials most deployments won't have configured:
  #   docker compose --profile voice up
  voice-worker:
    profiles: ["voice"]
    build:
      context: ./worker
    restart: unless-stopped
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      SENTINEL_API_BASE_URL: ${SENTINEL_API_BASE_URL:-http://app:3000/api/chat}
      VOICE_WORKER_SECRET: ${VOICE_WORKER_SECRET:-}
    networks:
      - sentinel_net
    depends_on:
      app:
        condition: service_healthy

networks:
  sentinel_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  agent_configs:
  agent_logs:
